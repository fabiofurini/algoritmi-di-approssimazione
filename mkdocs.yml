      link: https://fabiofurini.github.io/algoritmi-di-approssimazione/
      lang: it
    - name: English
      link: https://fabiofurini.github.io/approximation-algorithms/
      lang: en

extra_css:
  - stylesheets/collana.css
  - stylesheets/extra.css?v=76c997ebec
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraph.css
  - stylesheets/interattivi.css?v=c51ac2286b
  - stylesheets/quiz.css?v=9e3792b41c

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: In questa pagina
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/collana.js?v=4f68d7e6a2
  - javascripts/cloudflare-analytics.js?v=bff73345a1
  - javascripts/mathjax.js?v=01373df78e
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js
  # grafici interattivi: JSXGraph, il motore, poi le ricette (gi-*.js, le aggiunge genera_sito.py)
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraphcore.js
  - javascripts/interattivi.js?v=39321dc727
  - javascripts/gi-comune.js?v=40df75e3e5
  - javascripts/gi-oc-0.js?v=5527578c8a
  - javascripts/gi-oc-b.js?v=f94d1a1e3f
  - javascripts/gi-oc-c.js?v=e1eaa15ba1
  - javascripts/gi-oc-d.js?v=e10e954f50
  - javascripts/gi-oc-f.js?v=6658174d09
  - javascripts/quiz.js?v=be7fae2b85

nav:
  - Home: index.md
  - "Principi":
      - principi.md
      - "1. Principi": approximation.md
  - "Problemi di packing":
      - problemi-di-packing.md
      - "2. Zaino 0/1 (KP)": knapsack-approximation.md
      - "3. Bin packing (BPP)": bin-packing-approximation.md
  - "Limiti dell'approssimazione":
      - limiti-dell-approssimazione.md
      - "4. Colorazione dei vertici (VCP)": coloring-inapproximability.md
      - "5. Clique massima (MCP)": clique-inapproximability.md
  - "Routing e scheduling":
      - routing-e-scheduling.md
      - "6. Commesso viaggiatore (TSP)": tsp-approximation.md
      - "7. Macchine parallele identiche (P||Cmax)": pcmax-approximation.md
  - Esercizi:
      - esercizi/index.md
      - "Principi":
          - "1. Principi": esercizi/approximation.md
      - "Problemi di packing":
          - "2. Zaino 0/1 (KP)": esercizi/knapsack-approximation.md
          - "3. Bin packing (BPP)": esercizi/bin-packing-approximation.md
      - "Limiti dell'approssimazione":
          - "4. Colorazione dei vertici (VCP)": esercizi/coloring-inapproximability.md
          - "5. Clique massima (MCP)": esercizi/clique-inapproximability.md
      - "Routing e scheduling":
          - "6. Commesso viaggiatore (TSP)": esercizi/tsp-approximation.md
          - "7. Macchine parallele identiche (P||Cmax)": esercizi/pcmax-approximation.md
  - Quiz: autovalutazione.md
  - Laboratorio: laboratorio/index.md
  - Materiale:
      - materiale.md
      - Notebook Colab: notebook.md
  - Indice: indice.md
