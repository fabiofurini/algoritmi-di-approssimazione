# Modello di mkdocs.yml (italiano): lo usa genera_sito.py, che scrive mkdocs.yml.
# Non modificare mkdocs.yml a mano.
site_name: Algoritmi di approssimazione · Fabio Furini
site_description: >-
  Dispense sugli algoritmi di approssimazione: garanzie di prestazione e come si dimostrano, algoritmi, analisi del caso peggiore e istanze tight per lo zaino, il bin packing, il TSP metrico e lo scheduling su macchine parallele, schemi di approssimazione e limiti dell'approssimazione, con esercizi, slide, notebook Colab e app interattive.
site_author: Fabio Furini
site_url: https://fabiofurini.github.io/algoritmi-di-approssimazione/
repo_url: https://github.com/fabiofurini/algoritmi-di-approssimazione
copyright: >-
  &copy; 2026 Fabio Furini — testi e figure con licenza
  <a href="https://creativecommons.org/licenses/by/4.0/deed.it">CC BY 4.0</a>,
  codice con licenza
  <a href="https://github.com/fabiofurini/algoritmi-di-approssimazione/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: it
  icon:
    logo: material/approximately-equal
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Tema chiaro
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

# le pagine delle singole app non stanno nel menu: il laboratorio è una voce sola
not_in_nav: |
  /laboratorio/*.md
  !/laboratorio/index.md

plugins:
  - search:
      lang: it

extra:
  social:
    - icon: material/web
      link: https://fabiofurini.github.io/
      name: Fabio Furini — sito personale
    - icon: material/school
